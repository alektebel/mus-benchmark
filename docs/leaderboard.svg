<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-labelledby="t d">
<title id="t">mus_bench leaderboard</title>
<desc id="d">#1 Jev (TypeSafe) +9.5 piedras/hand; #2 GLM-5.3 Flash -1.1 piedras/hand; #3 Gemma 4 -1.7 piedras/hand; #4 Qwen 3.6 -2.0 piedras/hand; #5 DeepSeek-V4 Flash -4.6 piedras/hand</desc>
<style>
