<line x1="64" x2="852" y1="156.9" y2="156.9" class="grid"/><text x="56" y="160.9" font-size="11" text-anchor="end" class="f mono">1150</text>
<line x1="64" x2="852" y1="134.1" y2="134.1" class="grid"/><text x="56" y="138.1" font-size="11" text-anchor="end" class="f mono">1200</text>
<line x1="64" x2="852" y1="111.3" y2="111.3" class="grid"/><text x="56" y="115.3" font-size="11" text-anchor="end" class="f mono">1250</text>
<line x1="640.8" x2="640.8" y1="92" y2="376" class="base" stroke-dasharray="4 4"/><line x1="64" x2="852" y1="217.0" y2="217.0" class="base" stroke-dasharray="4 4"/>
<text x="64" y="84" font-size="11" class="f">Elo · higher is better</text><text x="458" y="418" font-size="11" text-anchor="middle" class="f">Seconds per decision · log scale · lower is better (CLI seats include start-up)</text>
