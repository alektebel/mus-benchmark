<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Elo against seconds per decision">
<style>
text{font-family:'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.card{fill:#ffffff;stroke:#e5e7e0} .t{fill:#181c21} .m{fill:#5d646d} .f{fill:#737a83}
.grid{stroke:#e9ebe4} .base{stroke:#9aa0a8} .soft{fill:#f6f7f3} .line{stroke:#e5e7e0}
.lime{fill:#d7f77d} .limeink{fill:#2f3d06} .quad{fill:#c7ef5c;fill-opacity:.28}
.chip{fill:#ffffff;stroke:#e5e7e0} .ico{color:#16191d} .halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.pill{fill:#16191d} .pillt{fill:#ffffff}
@media (prefers-color-scheme:dark){
 .card{fill:#121518;stroke:#252a30} .t{fill:#eceef1} .m{fill:#a7aeb7} .f{fill:#8b929c}
 .grid{stroke:#20252b} .base{stroke:#6f7680} .soft{fill:#1a1e23} .line{stroke:#252a30}
 .lime{fill:#c9ef5f} .limeink{fill:#1d2604} .quad{fill:#c9ef5f;fill-opacity:.10}
 .halo{stroke:#121518} .pill{fill:#eceef1} .pillt{fill:#121518}}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.fade{animation:fade .5s ease-out backwards}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.fade{animation:none}}
</style>
<rect x=".5" y=".5" width="879" height="439" rx="14" class="card"/>
<text x="24" y="40" font-size="20" font-weight="600" class="t">Elo vs speed: who plays well, fast</text>
<text x="24" y="62" font-size="12.5" class="m">Fitted Elo against the average seconds a model takes per decision</text>
<rect x="64" y="92" width="576.8" height="125.0" class="quad"/>
<text x="74" y="110" font-size="12" font-weight="600" class="t">Most attractive</text>
<line x1="94.8" x2="94.8" y1="92" y2="376" class="grid"/><text x="94.8" y="392" font-size="11" text-anchor="middle" class="f mono">0.2s</text>
<line x1="240.9" x2="240.9" y1="92" y2="376" class="grid"/><text x="240.9" y="392" font-size="11" text-anchor="middle" class="f mono">0.5s</text>
