<line x1="64" x2="852" y1="248.1" y2="248.1" class="grid"/><text x="56" y="252.1" font-size="11" text-anchor="end" class="f mono">950</text>
<line x1="64" x2="852" y1="225.3" y2="225.3" class="grid"/><text x="56" y="229.3" font-size="11" text-anchor="end" class="f mono">1000</text>
<line x1="64" x2="852" y1="202.5" y2="202.5" class="grid"/><text x="56" y="206.5" font-size="11" text-anchor="end" class="f mono">1050</text>
