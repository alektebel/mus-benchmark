# The mus_bench model roster.
#
# To add a model, append one [[model]] block and run:
#
#     python -m musbench.leaderboard run <id>     # plays the new model (API spend)
#     python -m musbench.leaderboard score        # refreshes README + leaderboard.svg
#
# or do both in one step with `python -m musbench.leaderboard add ...` (see
# docs/SCORING.md). `id` is the name stored in benchmark/matches.jsonl and must
# never change once matches exist; `spec` is anything the harness accepts
# (`provider:model`, a bare model name for the default provider, `anthropic:...`,
# `typesafe:...`, or an offline baseline such as `heuristic`).
#
# Logos are picked from the id (gemma -> Google + Gemma, qwen -> Alibaba Cloud +
# Qwen, ...; see FAMILIES in src/musbench/leaderboard/icons.py). Override with
# optional `provider = "..."`, `provider_icon = "slug"`, `model_icon = "slug"`,
# where slug is a file in benchmark/icons/ (`python -m musbench.leaderboard icon
# <slug>` downloads any LobeHub logo).

[benchmark]
# v3-menu: every decision is a numbered pick from the engine's legal moves
# (src/musbench/harness/menu.py), on the engine with lance-órdago and
# mano-tiebreak fixes. Not comparable with v2 (free-form JSON, kernel harness).
protocol = "v3-menu"
harness = "menu"
hands = 8                 # hands per match
seeds = [0, 1, 2, 3]      # every pairing plays every seed in BOTH seatings
# Models play only each other. Every model starts at start_elo and the field
# average stays there (no fixed reference bot: classic Elo is relative).
anchor = ""
start_elo = 1000
# Only matches tagged with this tournament count: changing it starts every
# model level again (older rows stay in the ledger as history).
tournament = "elo-1"
bootstrap = 2000          # resamples for the 95% interval

[[model]]
id = "claude-fable-5-2"
name = "Claude Fable 5.2"
spec = "claude-cli:claude-fable-5-2"

[[model]]
id = "claude-opus-5-5"
name = "Claude Opus 5.5"
spec = "claude-cli:claude-opus-5-5"

[[model]]
id = "claude-sonnet-5-5"
name = "Claude Sonnet 5.5"
spec = "claude-cli:claude-sonnet-5-5"

[[model]]
id = "claude-haiku-5-5"
name = "Claude Haiku 5.5"
spec = "claude-cli:claude-haiku-5-5"

[[model]]
id = "gpt-6-sol"
name = "GPT-6 Sol (Codex)"
spec = "codex-cli:gpt-6-sol"

[[model]]
id = "gpt-5.6-sol"
name = "GPT-5.6 Sol (Codex)"
spec = "codex-cli:gpt-5.6-sol"

[[model]]
id = "cursor-composer-2.5"
name = "Cursor Composer 2.5"
spec = "cursor-cli:composer-2.5"
provider = "Cursor"
provider_icon = "cursor"
model_icon = "cursor"

[[model]]
id = "typesafe:jev-latest"
name = "Jev (TypeSafe)"
spec = "typesafe:jev-latest"

# Needs OPENROUTER_API_KEY in the environment (paid; about $0.30 per M input tokens).
[[model]]
