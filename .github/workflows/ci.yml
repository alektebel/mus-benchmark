name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install requests

      - name: Unit + live + e2e
        env:
          PYTHONPATH: src
          MUS_ALLOW_NVIDIA: "0"
        run: |
          python -m unittest discover -s tests -v

      - name: Leaderboard is in sync with the ledger
        env:
          PYTHONPATH: src
        run: |
          python -m musbench.leaderboard score
          git diff --exit-code -- README.md docs/leaderboard.svg docs/speed.svg docs/heatmap.svg docs/skills.svg benchmark/leaderboard.json \
            || { echo "::error::run 'python -m musbench.leaderboard score' and commit"; exit 1; }

      - name: Static page build dry-run
        run: |
          mkdir -p /tmp/mus-pages-ci
          MUS_BACKEND=https://example.test PAGES_DIR=/tmp/mus-pages-ci \
            bash publish/build_static_play.sh /tmp/mus-pages-ci/index.html
          grep -q "const API = 'https://example.test';" /tmp/mus-pages-ci/index.html
